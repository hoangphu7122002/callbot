apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f /home/hoangphu7122002/callbot/docker-compose.yml
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: pusher
  name: pusher
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: pusher
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f /home/hoangphu7122002/callbot/docker-compose.yml
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: pusher
    spec:
      containers:
        - name: pusher
          image: hoangphupickleball/callbot-pusher:latest
          imagePullPolicy: Never
          resources:
            limits:
              cpu: 500m
              memory: "1073741824"
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /app/records1
              name: records-volume
            - mountPath: /app/.env
              name: pusher-cm1
              subPath: .env
      # restartPolicy: Never
      imagePullSecrets:
      - name: regcred
      volumes:
        - name: records-volume
          persistentVolumeClaim:
            claimName: records-pvc-new
        - configMap:
            items:
              - key: .env
                path: .env
            name: pusher-cm1
          name: pusher-cm1
